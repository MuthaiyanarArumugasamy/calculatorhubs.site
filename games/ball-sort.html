<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Play Ball Sort Puzzle online for free. Sort all colored balls into matching tubes.">
<title>Ball Sort Puzzle - Free Online Game</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    min-height:100vh;
    background:
        radial-gradient(circle at top,#252c55 0%,#11152d 45%,#080a16 100%);
    color:white;
    overflow-x:hidden;
}

header{
    text-align:center;
    padding:22px 15px 10px;
}

header h1{
    font-size:clamp(28px,7vw,48px);
    margin-bottom:7px;
}

header p{
    color:#bfc5df;
    font-size:14px;
}

.topbar{
    width:min(950px,94%);
    margin:15px auto;
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
}

.stat{
    min-width:100px;
    padding:10px 16px;
    border-radius:14px;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.1);
    text-align:center;
}

.stat small{
    display:block;
    color:#aeb5d2;
    font-size:11px;
    margin-bottom:4px;
}

.stat strong{
    font-size:19px;
}

.controls{
    width:min(950px,94%);
    margin:12px auto;
    display:flex;
    justify-content:center;
    gap:9px;
    flex-wrap:wrap;
}

button{
    border:0;
    cursor:pointer;
    color:white;
    font-weight:700;
    border-radius:12px;
    padding:11px 17px;
    background:#242b4b;
    transition:.2s;
}

button:hover{
    transform:translateY(-2px);
    filter:brightness(1.15);
}

button:active{
    transform:scale(.96);
}

.primary{
    background:#6c63ff;
}

.success{
    background:#19a974;
}

.warning{
    background:#c88918;
}

.danger{
    background:#c43d58;
}

.game{
    width:min(1000px,96%);
    margin:20px auto 30px;
}

.tubes{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(72px,92px));
    justify-content:center;
    gap:22px 18px;
    align-items:end;
}

.tube{
    width:78px;
    height:205px;
    position:relative;
    border:3px solid rgba(255,255,255,.45);
    border-top:0;
    border-radius:0 0 28px 28px;
    background:rgba(255,255,255,.045);
    padding:8px 7px;
    display:flex;
    flex-direction:column-reverse;
    gap:5px;
    justify-content:flex-start;
    cursor:pointer;
    transition:.2s;
    box-shadow:
        inset 0 0 15px rgba(255,255,255,.04),
        0 8px 25px rgba(0,0,0,.2);
}

.tube::before{
    content:"";
    position:absolute;
    left:-5px;
    top:-4px;
    width:calc(100% + 10px);
    height:15px;
    border:3px solid rgba(255,255,255,.45);
    border-bottom:0;
    border-radius:18px 18px 0 0;
}

.tube.selected{
    transform:translateY(-12px);
    border-color:#fff;
    box-shadow:
        0 0 0 3px rgba(108,99,255,.5),
        0 15px 35px rgba(108,99,255,.3);
}

.tube.hint{
    animation:hintGlow .7s infinite alternate;
}

@keyframes hintGlow{
    from{
        box-shadow:0 0 5px #ffe066;
    }
    to{
        box-shadow:0 0 28px #ffe066;
    }
}

.ball{
    width:58px;
    height:40px;
    border-radius:50%;
    margin:auto auto 0;
    flex-shrink:0;
    box-shadow:
        inset 0 7px 10px rgba(255,255,255,.35),
        inset 0 -7px 10px rgba(0,0,0,.25),
        0 4px 8px rgba(0,0,0,.25);
    position:relative;
}

.ball::after{
    content:"";
    position:absolute;
    width:16px;
    height:8px;
    border-radius:50%;
    background:rgba(255,255,255,.38);
    left:12px;
    top:7px;
    transform:rotate(-20deg);
}

.red{
    background:linear-gradient(145deg,#ff657d,#d71943);
}

.blue{
    background:linear-gradient(145deg,#64b5ff,#2167dc);
}

.green{
    background:linear-gradient(145deg,#55e69a,#07945a);
}

.yellow{
    background:linear-gradient(145deg,#ffe86b,#e7a900);
}

.purple{
    background:linear-gradient(145deg,#c784ff,#7c36c9);
}

.orange{
    background:linear-gradient(145deg,#ffad60,#e45a12);
}

.pink{
    background:linear-gradient(145deg,#ff83c8,#d52685);
}

.cyan{
    background:linear-gradient(145deg,#65f3ff,#079eac);
}

.level-area{
    width:min(950px,94%);
    margin:10px auto 35px;
    text-align:center;
}

.level-area h2{
    font-size:18px;
    margin-bottom:12px;
}

.levels{
    display:flex;
    gap:7px;
    justify-content:center;
    flex-wrap:wrap;
}

.level-btn{
    width:39px;
    height:39px;
    padding:0;
    border-radius:10px;
    background:#202641;
    color:#cbd0e8;
}

.level-btn.active{
    background:#6c63ff;
    color:white;
}

.level-btn.locked{
    opacity:.35;
    cursor:not-allowed;
}

.message{
    text-align:center;
    color:#aeb5d2;
    font-size:13px;
    margin:10px 0 25px;
}

.overlay{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(3,5,15,.82);
    backdrop-filter:blur(8px);
    z-index:100;
    padding:20px;
}

.overlay.show{
    display:flex;
}

.popup{
    width:min(420px,95%);
    text-align:center;
    background:#171b36;
    border:1px solid rgba(255,255,255,.12);
    border-radius:24px;
    padding:30px 22px;
    box-shadow:0 25px 80px rgba(0,0,0,.5);
}

.popup .emoji{
    font-size:55px;
    margin-bottom:10px;
}

.popup h2{
    font-size:28px;
    margin-bottom:8px;
}

.popup p{
    color:#b8bed7;
    line-height:1.6;
    margin-bottom:20px;
}

.popup-buttons{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
}

footer{
    text-align:center;
    padding:20px;
    color:#777f9e;
    font-size:12px;
}

@media(max-width:600px){

    header{
        padding-top:16px;
    }

    .tube{
        width:68px;
        height:180px;
    }

    .ball{
        width:50px;
        height:34px;
    }

    .tubes{
        gap:17px 10px;
    }

    .stat{
        min-width:88px;
        padding:8px 11px;
    }
}

@media(max-width:380px){

    .tube{
        width:61px;
        height:165px;
        padding:6px 5px;
    }

    .ball{
        width:46px;
        height:30px;
    }

    .tubes{
        gap:14px 7px;
    }
}
</style>
</head>

<body>

<header>
    <h1>🧪 Ball Sort Puzzle</h1>
    <p>Sort every color into the correct tube!</p>
</header>

<div class="topbar">

    <div class="stat">
        <small>LEVEL</small>
        <strong id="levelText">1</strong>
    </div>

    <div class="stat">
        <small>MOVES</small>
        <strong id="movesText">0</strong>
    </div>

    <div class="stat">
        <small>BEST</small>
        <strong id="bestText">-</strong>
    </div>

    <div class="stat">
        <small>HINTS</small>
        <strong id="hintText">3</strong>
    </div>

</div>

<div class="controls">
    <button class="primary" onclick="newGame()">🔄 Restart</button>
    <button onclick="undoMove()">↩ Undo</button>
    <button class="warning" onclick="useHint()">💡 Hint</button>
</div>

<div class="game">
    <div id="tubes" class="tubes"></div>

    <div class="message">
        Tap a tube to pick a ball, then tap another tube to move it.
    </div>
</div>

<div class="level-area">
    <h2>Choose Level</h2>
    <div id="levels" class="levels"></div>
</div>

<footer>
    © CalculatorHubs — Free Online Games
</footer>

<div id="winOverlay" class="overlay">

    <div class="popup">

        <div class="emoji">🎉</div>

        <h2>Level Complete!</h2>

        <p id="winText">
            Great job!
        </p>

        <div class="popup-buttons">

            <button class="primary" onclick="nextLevel()">
                ▶ Next Level
            </button>

            <button onclick="closePopup()">
                ✕ Close
            </button>

        </div>

    </div>

</div>

<script>

const COLORS = [
    "red",
    "blue",
    "green",
    "yellow",
    "purple",
    "orange",
    "pink",
    "cyan"
];

const BALLS_PER_COLOR = 4;
const MAX_LEVEL = 50;

let level = 1;
let tubes = [];
let selectedTube = null;
let moves = 0;
let hints = 3;
let history = [];
let hintTimer = null;

let unlocked =
    Number(localStorage.getItem("ballSortUnlocked")) || 1;

if(unlocked < 1){
    unlocked = 1;
}

function colorCountForLevel(lvl){

    return Math.min(
        2 + Math.floor((lvl - 1) / 4),
        8
    );

}

function createSolvedBalls(colorCount){

    let balls = [];

    for(let c = 0; c < colorCount; c++){

        for(let i = 0; i < BALLS_PER_COLOR; i++){

            balls.push(COLORS[c]);

        }

    }

    return balls;
}

/*
    Creates a shuffled puzzle.
*/
function generateLevel(lvl){

    const colorCount = colorCountForLevel(lvl);

    let balls = createSolvedBalls(colorCount);

    shuffle(balls);

    let tubeCount =
        colorCount +
        (lvl >= 10 ? 3 : 2);

    let result = [];

    for(let i = 0; i < tubeCount; i++){

        result.push([]);

    }

    let index = 0;

    /*
       Distribute the balls randomly.
    */
    for(let i = 0; i < balls.length; i++){

        result[index].push(balls[i]);

        index++;

        if(index >= colorCount){
            index = 0;
        }

    }

    /*
       Shuffle individual tube contents.
    */
    for(let tube of result){

        shuffle(tube);

    }

    return result;
}

function shuffle(array){

    for(let i = array.length - 1; i > 0; i--){

        const j =
            Math.floor(Math.random() * (i + 1));

        [array[i],array[j]] =
        [array[j],array[i]];

    }

    return array;
}

function render(){

    const container =
        document.getElementById("tubes");

    container.innerHTML = "";

    tubes.forEach((tube,index)=>{

        const div =
            document.createElement("div");

        div.className = "tube";

        if(selectedTube === index){
            div.classList.add("selected");
        }

        div.dataset.index = index;

        div.onclick = () => tubeClick(index);

        tube.forEach(color=>{

            const ball =
                document.createElement("div");

            ball.className =
                "ball " + color;

            div.appendChild(ball);

        });

        container.appendChild(div);

    });

    document.getElementById("levelText")
        .textContent = level;

    document.getElementById("movesText")
        .textContent = moves;

    document.getElementById("hintText")
        .textContent = hints;

    updateBest();

    renderLevels();
}

function tubeClick(index){

    if(selectedTube === null){

        if(tubes[index].length === 0){

            return;

        }

        selectedTube = index;

        render();

        return;
    }

    if(selectedTube === index){

        selectedTube = null;

        render();

        return;
    }

    if(canMove(selectedTube,index)){

        saveHistory();

        moveBall(
            selectedTube,
            index
        );

        moves++;

        selectedTube = null;

        render();

        checkWin();

    }else{

        /*
          If player taps another non-empty tube,
          switch selection.
        */
        if(tubes[index].length > 0){

            selectedTube = index;

            render();

        }

    }

}

function canMove(from,to){

    if(tubes[from].length === 0){
        return false;
    }

    if(tubes[to].length >= BALLS_PER_COLOR){
        return false;
    }

    if(tubes[to].length === 0){
        return true;
    }

    const moving =
        tubes[from][tubes[from].length - 1];

    const target =
        tubes[to][tubes[to].length - 1];

    return moving === target;
}

function moveBall(from,to){

    const ball =
        tubes[from].pop();

    tubes[to].push(ball);

}

function saveHistory(){

    history.push(
        JSON.parse(JSON.stringify(tubes))
    );

    if(history.length > 50){

        history.shift();

    }

}

function undoMove(){

    if(history.length === 0){

        return;

    }

    tubes =
        history.pop();

    moves++;

    selectedTube = null;

    render();

}

function isTubeSolved(tube){

    if(tube.length === 0){
        return true;
    }

    if(tube.length !== BALLS_PER_COLOR){
        return false;
    }

    return tube.every(
        color => color === tube[0]
    );

}

function checkWin(){

    const solved =
        tubes.every(
            tube => isTubeSolved(tube)
        );

    if(!solved){
        return;
    }

    saveBest();

    setTimeout(()=>{

        document.getElementById("winText")
            .textContent =
            `You solved Level ${level} in ${moves} moves!`;

        document
            .getElementById("winOverlay")
            .classList.add("show");

        if(level >= unlocked){

            unlocked =
                Math.min(level + 1,MAX_LEVEL);

            localStorage.setItem(
                "ballSortUnlocked",
                unlocked
            );

        }

    },250);

}

function newGame(){

    closePopup();

    selectedTube = null;
    moves = 0;
    hints = 3;
    history = [];

    tubes =
        generateLevel(level);

    render();

}

function goToLevel(lvl){

    if(lvl > unlocked){

        return;

    }

    level = lvl;

    newGame();

}

function nextLevel(){

    closePopup();

    if(level < MAX_LEVEL){

        level++;

    }

    if(level > unlocked){

        unlocked = level;

        localStorage.setItem(
            "ballSortUnlocked",
            unlocked
        );

    }

    newGame();

}

function closePopup(){

    document
        .getElementById("winOverlay")
        .classList.remove("show");

}

function renderLevels(){

    const container =
        document.getElementById("levels");

    container.innerHTML = "";

    for(let i = 1; i <= MAX_LEVEL; i++){

        const btn =
            document.createElement("button");

        btn.className = "level-btn";

        if(i === level){

            btn.classList.add("active");

        }

        if(i > unlocked){

            btn.classList.add("locked");

            btn.textContent = "🔒";

        }else{

            btn.textContent = i;

            btn.onclick = () => goToLevel(i);

        }

        container.appendChild(btn);

    }

}

function useHint(){

    if(hints <= 0){

        return;

    }

    const move =
        findHint();

    if(!move){

        return;

    }

    hints--;

    const elements =
        document.querySelectorAll(".tube");

    elements[move.from]
        .classList.add("hint");

    elements[move.to]
        .classList.add("hint");

    clearTimeout(hintTimer);

    hintTimer =
        setTimeout(()=>{

            elements.forEach(el=>{
                el.classList.remove("hint");
            });

        },1200);

    document.getElementById("hintText")
        .textContent = hints;

}

function findHint(){

    /*
       First find matching-color moves.
    */

    for(let from = 0; from < tubes.length; from++){

        if(tubes[from].length === 0){
            continue;
        }

        const moving =
            tubes[from][tubes[from].length - 1];

        for(let to = 0; to < tubes.length; to++){

            if(from === to){
                continue;
            }

            if(
                tubes[to].length > 0 &&
                tubes[to].length < BALLS_PER_COLOR &&
                tubes[to][tubes[to].length - 1] === moving
            ){

                return {from,to};

            }

        }

    }

    /*
       Then find empty tube.
    */

    for(let from = 0; from < tubes.length; from++){

        if(tubes[from].length === 0){
            continue;
        }

        for(let to = 0; to < tubes.length; to++){

            if(from !== to && tubes[to].length === 0){

                return {from,to};

            }

        }

    }

    return null;

}

function getBestKey(){

    return "ballSortBest_" + level;

}

function updateBest(){

    const best =
        localStorage.getItem(getBestKey());

    document.getElementById("bestText")
        .textContent =
        best ? best : "-";

}

function saveBest(){

    const key =
        getBestKey();

    const old =
        Number(localStorage.getItem(key));

    if(!old || moves < old){

        localStorage.setItem(
            key,
            moves
        );

    }

}

/*
   Start game.
*/
newGame();

</script>

</body>
</html>
