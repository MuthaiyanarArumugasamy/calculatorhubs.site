<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ball Sort Extreme - Free Puzzle Game</title>
<meta name="description" content="Play Ball Sort Extreme, a challenging free color sorting puzzle game with 100 levels.">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;min-height:100vh;color:#fff;background:radial-gradient(circle at top,#263452,#0b101a 65%);padding:18px}
.wrap{max-width:1050px;margin:auto}
header{text-align:center;margin:8px 0 18px}
h1{font-size:30px}.sub{color:#aab5c9;margin-top:5px;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;max-width:720px;margin:15px auto}
.stat{background:#ffffff0d;border:1px solid #ffffff18;border-radius:14px;padding:11px;text-align:center}
.label{font-size:10px;color:#8996ad;text-transform:uppercase}.val{font-size:21px;font-weight:800;margin-top:3px}
.controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:12px 0}
button{border:1px solid #ffffff18;background:#1d2940;color:#fff;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}
button:hover{background:#2b3a58;transform:translateY(-1px)}button:disabled{opacity:.4;cursor:not-allowed}
.primary{background:#536dff}.msg{text-align:center;color:#aab5c9;min-height:24px;font-size:14px}
.board{display:grid;grid-template-columns:repeat(6,78px);justify-content:center;gap:17px;min-height:360px;padding:24px 0}
.tube{width:78px;height:265px;border:3px solid #ffffff55;border-top:0;border-radius:0 0 27px 27px;display:flex;flex-direction:column-reverse;align-items:center;gap:5px;padding:8px 4px;cursor:pointer;background:linear-gradient(90deg,#ffffff08,#ffffff16,#ffffff08);box-shadow:inset 0 0 20px #ffffff08,0 12px 25px #0005;position:relative;transition:.18s}
.tube:before{content:"";position:absolute;top:-3px;left:-3px;right:-3px;height:11px;border:3px solid #ffffff55;border-bottom:0;border-radius:18px 18px 0 0}
.tube.selected{transform:translateY(-10px);border-color:#fff;box-shadow:0 0 0 3px #ffffff12,0 0 25px #fff4}
.ball{width:49px;height:49px;border-radius:50%;flex:none;position:relative;box-shadow:inset -7px -9px 12px #0004,inset 6px 6px 10px #fff5,0 5px 9px #0005}
.ball:after{content:"";position:absolute;width:13px;height:13px;border-radius:50%;background:#ffffff99;top:7px;left:9px}
.c0{background:#ff4757}.c1{background:#2e86ff}.c2{background:#20bf6b}.c3{background:#feca57}.c4{background:#a55eea}.c5{background:#ff9f43}.c6{background:#ff6bcb}.c7{background:#18dcff}.c8{background:#badc58}.c9{background:#1dd1a1}.c10{background:#5f27cd}.c11{background:#ff7675}
.levelTitle{text-align:center;margin:10px 0}.levels{display:grid;grid-template-columns:repeat(10,1fr);gap:7px;max-width:850px;margin:auto}.levels button{padding:8px 2px;font-size:12px}.levels .current{background:#536dff}.levels .done{background:#15533e}.levels .locked{color:#667188;background:#111827}
.hintFrom{outline:3px solid white;animation:pulse .8s infinite}.hintTo{outline:3px solid #feca57;animation:pulse .8s infinite}
@keyframes pulse{50%{transform:translateY(-6px)}}
.overlay{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:20px;z-index:5}.overlay.show{display:flex}
.popup{background:#151e30;border:1px solid #ffffff18;border-radius:22px;padding:30px;text-align:center;width:min(410px,100%);box-shadow:0 30px 80px #0008}.icon{font-size:48px}.popup p{color:#aab5c9;margin:10px 0 20px}.popup button{margin:3px}
footer{text-align:center;color:#65728a;font-size:12px;margin:25px 0}
@media(max-width:700px){body{padding:10px}h1{font-size:24px}.stats{gap:5px}.stat{padding:9px 3px}.val{font-size:18px}.label{font-size:8px}.board{grid-template-columns:repeat(4,67px);gap:13px 9px;min-height:auto}.tube{width:67px;height:220px}.ball{width:40px;height:40px}.levels{grid-template-columns:repeat(5,1fr)}button{padding:9px 11px;font-size:12px}}
@media(max-width:380px){.board{grid-template-columns:repeat(4,61px);gap:9px 6px}.tube{width:61px;height:205px}.ball{width:36px;height:36px}}
</style>
</head>
<body>
<div class="wrap">
<header><h1>🧪 Ball Sort Extreme</h1><div class="sub">Simple rules. Brutal puzzles.</div></header>

<div class="stats">
<div class="stat"><div class="label">Level</div><div class="val" id="lv">1</div></div>
<div class="stat"><div class="label">Moves</div><div class="val" id="mv">0</div></div>
<div class="stat"><div class="label">Best</div><div class="val" id="best">—</div></div>
<div class="stat"><div class="label">Hints</div><div class="val" id="hintCount">3</div></div>
</div>

<div class="controls">
<button onclick="restart()">🔄 Restart</button>
<button id="undo" onclick="undo()">↩️ Undo</button>
<button id="hint" onclick="hint()">💡 Hint</button>
</div>
<div class="msg" id="msg">Select a tube to pick a ball.</div>
<div class="board" id="board"></div>

<div class="levelTitle">🏆 Levels</div>
<div class="levels" id="levels"></div>
<footer>Ball Sort Extreme • 100 Levels • Free Browser Game</footer>
</div>

<div class="overlay" id="overlay">
<div class="popup">
<div class="icon">🎉</div>
<h2>Level Complete!</h2>
<p id="winText"></p>
<button onclick="closeWin()">Levels</button>
<button class="primary" id="next" onclick="nextLevel()">Next Level →</button>
</div>
</div>

<script>
const MAX=100,CAP=4,COLORS=12;
const unlockedKey="bse_unlocked";
let level=1,board=[],history=[],selected=-1,moves=0,hints=3,unlocked=+localStorage.getItem(unlockedKey)||1;

function count(){return level<=5?4:level<=12?5:level<=22?6:level<=35?7:level<=50?8:level<=65?9:level<=80?10:level<=92?11:12}
function depth(){return level<=5?60+level*5:level<=15?110+level*7:level<=30?190+level*8:level<=50?330+level*8:level<=70?500+level*7:level<=85?680+level*6:900+level*5}
function seed(){return level*9176+28471}
function clone(b){return b.map(x=>x.slice())}

function solved(){
 let b=[];for(let c=0;c<count();c++)b.push([c,c,c,c]);b.push([]);b.push([]);return b;
}

/* Reverse generation: after removing the top ball, the source must
   still expose the same colour or be empty. This preserves a valid
   path back to the solved board. */
function reversePossible(b,a,z){
 if(a===z||!b[a].length||b[z].length>=CAP)return false;
 let ball=b[a][b[a].length-1];
 let below=b[a].length>1?b[a][b[a].length-2]:null;
 return below===null||below===ball;
}
function scramble(start,s){
 let b=clone(start),prevA=-1,prevZ=-1;
 for(let n=0;n<depth();n++){
  let choices=[];
  for(let a=0;a<b.length;a++)for(let z=0;z<b.length;z++){
   if(reversePossible(b,a,z)&&!(a===prevZ&&z===prevA))choices.push([a,z]);
  }
  if(!choices.length)break;
  s=(s*9301+49297)%233280;
  let p=choices[Math.floor(s/233280*choices.length)];
  b[p[1]].push(b[p[0]].pop());prevA=p[0];prevZ=p[1];
 }
 return b;
}
function quality(b){
 let q=0;
 for(let t of b){
  if(!t.length)continue;
  let u=new Set(t).size;q+=u*4;
  for(let i=1;i<t.length;i++)if(t[i]!==t[i-1])q+=9;
  if(t.length===4&&u===1)q-=25;
  if(t.length<4)q+=5;
 }
 return q;
}
function makePuzzle(){
 let best=null,score=-1e9,s=seed();
 for(let i=0;i<8;i++){let b=scramble(solved(),s+i*997),q=quality(b);if(q>score){score=q;best=b}}
 return best;
}
function start(){
 board=makePuzzle();history=[];selected=-1;moves=0;hints=3;render();stats();message("Select a tube to pick a ball.");
}
function render(){
 let el=document.getElementById("board");el.innerHTML="";
 board.forEach((t,i)=>{
  let tube=document.createElement("div");tube.className="tube"+(selected===i?" selected":"");tube.onclick=()=>select(i);
  t.forEach(c=>{let ball=document.createElement("div");ball.className="ball c"+c;tube.appendChild(ball)});
  el.appendChild(tube);
 });
}
function legal(a,z){
 if(!board[a].length||board[z].length>=CAP)return false;
 if(!board[z].length)return true;
 return board[a][board[a].length-1]===board[z][board[z].length-1];
}
function select(i){
 if(selected<0){
  if(!board[i].length)return message("That tube is empty.");
  selected=i;render();return message("Now select the destination tube.");
 }
 if(selected===i){selected=-1;render();return message("Selection cancelled.")}
 if(!legal(selected,i))return message("❌ That move is not allowed.");
 history.push(clone(board));board[i].push(board[selected].pop());moves++;selected=-1;render();stats();
 if(solvedCheck())win();
}
function solvedCheck(){
 return board.every(t=>!t.length||(t.length===CAP&&t.every(x=>x===t[0])));
}
function undo(){
 if(!history.length)return message("Nothing to undo.");
 board=history.pop();moves=Math.max(0,moves-1);selected=-1;render();stats();message("↩️ Move undone.");
}
function restart(){start();message("Level restarted.")}
function hint(){
 if(!hints)return message("No hints left.");
 let found=null;
 for(let a=0;a<board.length&&!found;a++)for(let z=0;z<board.length;z++){
  if(legal(a,z)&&board[z].length){found=[a,z];break}
 }
 if(!found)for(let a=0;a<board.length&&!found;a++)for(let z=0;z<board.length;z++){
  if(legal(a,z)&&!board[z].length){found=[a,z];break}
 }
 if(!found)return message("No simple hint available.");
 hints--;stats();
 let ts=document.querySelectorAll(".tube");ts[found[0]].classList.add("hintFrom");ts[found[1]].classList.add("hintTo");
 message("💡 Try the highlighted move.");
 setTimeout(()=>{ts[found[0]]?.classList.remove("hintFrom");ts[found[1]]?.classList.remove("hintTo")},1600);
}
function win(){
 let key="bse_best_"+level,old=+localStorage.getItem(key)||0;
 if(!old||moves<old)localStorage.setItem(key,moves);
 if(level>=unlocked){unlocked=Math.min(MAX,level+1);localStorage.setItem(unlockedKey,unlocked)}
 document.getElementById("winText").textContent=`Level ${level} completed in ${moves} moves!`;
 document.getElementById("overlay").classList.add("show");
 document.getElementById("next").style.display=level<MAX?"inline-block":"none";
 levels();
}
function closeWin(){document.getElementById("overlay").classList.remove("show")}
function nextLevel(){closeWin();if(level<MAX){level++;start();levels()}}
function loadLevel(n){if(n>unlocked)return message("🔒 Complete previous levels first.");level=n;closeWin();start();levels()}
function levels(){
 let el=document.getElementById("levels");el.innerHTML="";
 for(let i=1;i<=MAX;i++){
  let b=document.createElement("button");b.textContent=i;
  if(i===level)b.classList.add("current");
  if(localStorage.getItem("bse_best_"+i))b.classList.add("done");
  if(i>unlocked){b.textContent="🔒 "+i;b.classList.add("locked");b.disabled=true}
  else b.onclick=()=>loadLevel(i);
  el.appendChild(b);
 }
}
function stats(){
 document.getElementById("lv").textContent=level;
 document.getElementById("mv").textContent=moves;
 document.getElementById("best").textContent=localStorage.getItem("bse_best_"+level)||"—";
 document.getElementById("hintCount").textContent=hints;
 document.getElementById("undo").disabled=!history.length;
 document.getElementById("hint").disabled=!hints;
}
function message(x){document.getElementById("msg").textContent=x}
document.addEventListener("keydown",e=>{
 if(e.key==="Escape"){selected=-1;render();message("Selection cancelled.")}
 if(e.key.toLowerCase()==="u")undo();
 if(e.key.toLowerCase()==="h")hint();
});
levels();start();
</script>
</body>
</html>
