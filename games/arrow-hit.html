<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Arrow Hit Game - Free Online Game | CalculatorHubs</title>
<meta name="description" content="Play Arrow Hit online for free. Shoot arrows at the rotating target and beat your high score.">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#080812;
    color:#fff;
    overflow:hidden;
}

.game-wrapper{
    width:100%;
    max-width:600px;
    height:100vh;
    margin:auto;
    display:flex;
    flex-direction:column;
    padding:12px;
}

/* HEADER */

.header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
}

.logo{
    font-size:21px;
    font-weight:800;
}

.logo span{
    color:#ffbd35;
}

.stats{
    display:flex;
    gap:6px;
}

.stat{
    min-width:62px;
    padding:6px 9px;
    text-align:center;
    border-radius:10px;
    background:#171725;
    border:1px solid #29293b;
}

.stat small{
    display:block;
    color:#aaa;
    font-size:9px;
    margin-bottom:2px;
}

.stat strong{
    font-size:16px;
}

/* GAME */

#game{
    position:relative;
    flex:1;
    min-height:500px;
    overflow:hidden;
    border-radius:22px;
    background:
        radial-gradient(circle at 50% 20%,#242040 0%,#121120 38%,#080812 75%);
    border:1px solid #29283d;
    box-shadow:0 15px 50px rgba(0,0,0,.5);
    touch-action:manipulation;
}

/* STARS */

.star{
    position:absolute;
    width:2px;
    height:2px;
    border-radius:50%;
    background:white;
    opacity:.35;
}

/* LEVEL */

.level{
    position:absolute;
    top:15px;
    left:50%;
    transform:translateX(-50%);
    background:#171725;
    border:1px solid #303044;
    padding:7px 16px;
    border-radius:20px;
    font-size:13px;
    z-index:10;
}

/* TARGET */

#target{
    position:absolute;
    width:140px;
    height:140px;
    left:50%;
    top:130px;
    transform:translateX(-50%);
    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #222 0 10%,
            #fff 11% 24%,
            #e63838 25% 42%,
            #fff 43% 58%,
            #e63838 59% 75%,
            #fff 76% 100%
        );

    border:5px solid #ddd;

    box-shadow:
        0 0 20px rgba(255,70,70,.25),
        0 0 50px rgba(255,70,70,.08);
}

#target::after{
    content:"";
    position:absolute;
    width:12px;
    height:12px;
    border-radius:50%;
    background:#111;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
}

/* TARGET ROTATION */

.rotating{
    animation:rotateTarget 3s linear infinite;
}

@keyframes rotateTarget{
    from{
        transform:translateX(-50%) rotate(0deg);
    }
    to{
        transform:translateX(-50%) rotate(360deg);
    }
}

/* ARROWS */

.arrow{
    position:absolute;
    width:82px;
    height:6px;
    border-radius:5px;

    background:linear-gradient(
        90deg,
        #aaa,
        #fff
    );

    transform-origin:right center;

    z-index:8;

    box-shadow:0 0 8px rgba(255,255,255,.3);
}

.arrow::before{
    content:"";
    position:absolute;
    right:-1px;
    top:-5px;

    width:0;
    height:0;

    border-top:8px solid transparent;
    border-bottom:8px solid transparent;
    border-left:16px solid #eee;
}

.arrow::after{
    content:"";
    position:absolute;
    left:0;
    top:-5px;

    width:0;
    height:0;

    border-top:8px solid transparent;
    border-bottom:8px solid transparent;
    border-right:13px solid #ffbd35;
}

/* FIXED ARROWS */

.stuck-arrow{
    position:absolute;
    width:70px;
    height:5px;
    background:#eee;
    border-radius:4px;
    transform-origin:right center;
    z-index:7;
}

/* SHOOT BUTTON */

#shoot{
    position:absolute;
    bottom:18px;
    left:50%;
    transform:translateX(-50%);

    width:calc(100% - 36px);
    max-width:360px;
    height:54px;

    border:none;
    border-radius:17px;

    background:linear-gradient(
        135deg,
        #ffd15a,
        #ff9e23
    );

    color:#17100a;
    font-size:18px;
    font-weight:900;

    cursor:pointer;

    box-shadow:
        0 8px 25px rgba(255,166,35,.25);

    z-index:30;
}

#shoot:active{
    transform:translateX(-50%) scale(.96);
}

/* MESSAGE */

#message{
    position:absolute;
    top:48%;
    left:50%;
    transform:translate(-50%,-50%);

    text-align:center;
    z-index:20;

    opacity:0;
    pointer-events:none;

    transition:.2s;
}

#message.show{
    opacity:1;
}

#message h2{
    font-size:32px;
    margin-bottom:5px;
}

#message p{
    color:#bbb;
}

/* SCREENS */

.screen{
    position:absolute;
    inset:0;

    z-index:100;

    display:flex;
    justify-content:center;
    align-items:center;

    background:rgba(6,6,14,.96);

    padding:25px;
    text-align:center;
}

.panel{
    width:100%;
    max-width:380px;
}

.icon{
    font-size:65px;
    margin-bottom:10px;
}

.panel h1{
    font-size:36px;
    margin-bottom:10px;
}

.panel p{
    color:#aaa;
    line-height:1.6;
    margin-bottom:22px;
}

.main-btn{
    width:100%;
    height:52px;

    border:none;
    border-radius:15px;

    background:linear-gradient(
        135deg,
        #ffd15a,
        #ff9e23
    );

    color:#17100a;
    font-size:17px;
    font-weight:900;

    cursor:pointer;
}

.secondary-btn{
    margin-top:10px;
    width:100%;
    height:45px;

    border-radius:13px;

    border:1px solid #343447;
    background:#171725;
    color:#fff;

    font-size:15px;
    cursor:pointer;
}

.hidden{
    display:none !important;
}

/* GAME OVER */

.final-score{
    font-size:42px;
    font-weight:900;
    color:#ffd15a;
    margin:8px 0;
}

.best{
    color:#aaa;
    margin-bottom:20px;
}

/* HIT EFFECT */

.hit-effect{
    position:absolute;
    width:20px;
    height:20px;
    border:3px solid #ffd15a;
    border-radius:50%;
    pointer-events:none;
    animation:hitEffect .4s ease-out forwards;
    z-index:50;
}

@keyframes hitEffect{
    0%{
        transform:scale(.3);
        opacity:1;
    }
    100%{
        transform:scale(3);
        opacity:0;
    }
}

/* SHAKE */

.shake{
    animation:shake .25s;
}

@keyframes shake{
    0%,100%{transform:translateX(0)}
    25%{transform:translateX(-6px)}
    75%{transform:translateX(6px)}
}

/* MOBILE */

@media(max-width:480px){

    .game-wrapper{
        padding:8px;
    }

    .logo{
        font-size:18px;
    }

    .stat{
        min-width:55px;
        padding:5px 7px;
    }

    .stat strong{
        font-size:14px;
    }

    #target{
        width:120px;
        height:120px;
        top:125px;
    }

    #game{
        border-radius:18px;
    }
}

@media(max-height:650px){

    #target{
        top:85px;
    }

    #bow{
        bottom:68px;
    }

    #shoot{
        bottom:12px;
        height:48px;
    }
}
</style>
</head>

<body>

<div class="game-wrapper">

    <!-- HEADER -->

    <div class="header">

        <div class="logo">
            Calculator<span>Hubs</span>
        </div>

        <div class="stats">

            <div class="stat">
                <small>SCORE</small>
                <strong id="score">0</strong>
            </div>

            <div class="stat">
                <small>BEST</small>
                <strong id="best">0</strong>
            </div>

            <div class="stat">
                <small>❤</small>
                <strong id="lives">3</strong>
            </div>

        </div>

    </div>


    <!-- GAME AREA -->

    <div id="game">

        <div class="level">
            LEVEL <span id="level">1</span>
        </div>

        <div id="target"></div>

        <div id="message">
            <h2 id="messageTitle">Nice!</h2>
            <p id="messageText">Perfect hit!</p>
        </div>

        <button id="shoot">
            🏹 SHOOT ARROW
        </button>


        <!-- START SCREEN -->

        <div id="startScreen" class="screen">

            <div class="panel">

                <div class="icon">🏹</div>

                <h1>Arrow Hit</h1>

                <p>
                    Shoot arrows at the rotating target.
                    Don't hit the arrows already stuck in the target!
                </p>

                <button class="main-btn" id="startBtn">
                    ▶ PLAY NOW
                </button>

            </div>

        </div>


        <!-- GAME OVER -->

        <div id="gameOver" class="screen hidden">

            <div class="panel">

                <div class="icon">💥</div>

                <h1>Game Over</h1>

                <div class="final-score" id="finalScore">
                    0
                </div>

                <div class="best">
                    Best Score: <span id="finalBest">0</span>
                </div>

                <button class="main-btn" id="restartBtn">
                    🔄 PLAY AGAIN
                </button>

                <button class="secondary-btn" id="homeBtn">
                    🏠 HOME
                </button>

            </div>

        </div>

    </div>

</div>


<script>

/* =========================================
   ARROW HIT GAME
   CalculatorHubs.site
========================================= */

const game = document.getElementById("game");
const target = document.getElementById("target");

const scoreEl = document.getElementById("score");
const bestEl = document.getElementById("best");
const livesEl = document.getElementById("lives");
const levelEl = document.getElementById("level");

const shootBtn = document.getElementById("shoot");

const startScreen = document.getElementById("startScreen");
const gameOver = document.getElementById("gameOver");

const startBtn = document.getElementById("startBtn");
const restartBtn = document.getElementById("restartBtn");
const homeBtn = document.getElementById("homeBtn");

const finalScore = document.getElementById("finalScore");
const finalBest = document.getElementById("finalBest");

const message = document.getElementById("message");
const messageTitle = document.getElementById("messageTitle");
const messageText = document.getElementById("messageText");


/* GAME VARIABLES */

let score = 0;
let lives = 3;
let level = 1;

let arrows = [];

let playing = false;

let rotationSpeed = 3;

let targetSize = 140;


/* BEST SCORE */

let bestScore = Number(
    localStorage.getItem("arrowHitBest") || 0
);

bestEl.textContent = bestScore;


/* =========================================
   CREATE STARS
========================================= */

function createStars(){

    for(let i=0;i<45;i++){

        const star = document.createElement("div");

        star.className = "star";

        star.style.left =
            Math.random()*100 + "%";

        star.style.top =
            Math.random()*100 + "%";

        star.style.opacity =
            (0.15 + Math.random()*0.5);

        game.appendChild(star);
    }
}

createStars();


/* =========================================
   START GAME
========================================= */

function startGame(){

    score = 0;
    lives = 3;
    level = 1;

    arrows = [];

    playing = true;

    scoreEl.textContent = score;
    livesEl.textContent = lives;
    levelEl.textContent = level;

    gameOver.classList.add("hidden");
    startScreen.classList.add("hidden");

    clearArrows();

    rotationSpeed = 3;

    target.classList.add("rotating");

    target.style.animationDuration =
        rotationSpeed + "s";

}


/* =========================================
   CLEAR ARROWS
========================================= */

function clearArrows(){

    document
        .querySelectorAll(".arrow,.stuck-arrow")
        .forEach(el => el.remove());

}


/* =========================================
   SHOOT
========================================= */

function shootArrow(){

    if(!playing) return;

    const gameRect =
        game.getBoundingClientRect();

    const targetRect =
        target.getBoundingClientRect();


    /* ARROW START POSITION */

    const startX =
        gameRect.width / 2;

    const startY =
        gameRect.height - 105;


    /* TARGET CENTER */

    const targetCenterX =
        targetRect.left -
        gameRect.left +
        targetRect.width/2;

    const targetCenterY =
        targetRect.top -
        gameRect.top +
        targetRect.height/2;


    /* DISTANCE */

    const dx =
        targetCenterX - startX;

    const dy =
        targetCenterY - startY;

    const distance =
        Math.sqrt(dx*dx + dy*dy);


    /* ANGLE */

    const angle =
        Math.atan2(dy,dx) * 180 / Math.PI;


    /* CREATE ARROW */

    const arrow =
        document.createElement("div");

    arrow.className = "arrow";

    arrow.style.left =
        startX + "px";

    arrow.style.top =
        startY + "px";

    arrow.style.transform =
        `rotate(${angle}deg)`;

    game.appendChild(arrow);


    /* ANIMATE */

    const duration =
        Math.max(120, distance * 1.5);


    arrow.animate(
        [
            {
                left:startX + "px",
                top:startY + "px"
            },
            {
                left:targetCenterX + "px",
                top:targetCenterY + "px"
            }
        ],
        {
            duration:duration,
            easing:"linear"
        }
    );


    setTimeout(()=>{

        if(!playing) return;

        arrow.remove();

        checkCollision();

    },duration);

}


/* =========================================
   COLLISION
========================================= */

function checkCollision(){

    const targetRect =
        target.getBoundingClientRect();

    const centerX =
        targetRect.left +
        targetRect.width/2;

    const centerY =
        targetRect.top +
        targetRect.height/2;


    /*
       Every previously stuck arrow
       occupies an angle around target.
    */

    const currentAngle =
        Math.random()*360;


    for(const oldArrow of arrows){

        let difference =
            Math.abs(currentAngle -
            oldArrow.angle);

        if(difference > 180){
            difference =
                360 - difference;
        }


        /*
          Collision zone.
        */

        if(difference < 17){

            loseLife();

            return;
        }
    }


    /* SUCCESS */

    arrows.push({
        angle:currentAngle
    });

    score++;

    scoreEl.textContent = score;

    createStuckArrow(currentAngle);

    showHit();

    updateLevel();

}


/* =========================================
   CREATE STUCK ARROW
========================================= */

function createStuckArrow(angle){

    const arrow =
        document.createElement("div");

    arrow.className =
        "stuck-arrow";


    /*
      Arrow position is calculated
      around the target.
    */

    const radius =
        target.offsetWidth/2 + 8;


    const rad =
        angle * Math.PI/180;


    const x =
        target.offsetLeft +
        target.offsetWidth/2 +
        Math.cos(rad)*radius;


    const y =
        target.offsetTop +
        target.offsetHeight/2 +
        Math.sin(rad)*radius;


    arrow.style.left =
        x + "px";

    arrow.style.top =
        y + "px";


    arrow.style.transform =
        `rotate(${angle}deg)`;


    game.appendChild(arrow);

}


/* =========================================
   LEVEL SYSTEM
========================================= */

function updateLevel(){

    const newLevel =
        Math.floor(score / 5) + 1;


    if(newLevel !== level){

        level = newLevel;

        levelEl.textContent =
            level;


        /*
          Target gets faster.
        */

        rotationSpeed =
            Math.max(
                0.75,
                3 - (level-1)*0.25
            );


        target.style.animationDuration =
            rotationSpeed + "s";


        /*
          Every 10 points
          target becomes smaller.
        */

        if(level % 2 === 0){

            targetSize =
                Math.max(
                    95,
                    140 - level*5
                );

            target.style.width =
                targetSize + "px";

            target.style.height =
                targetSize + "px";
        }

    }

}


/* =========================================
   LOSE LIFE
========================================= */

function loseLife(){

    lives--;

    livesEl.textContent =
        lives;


    game.classList.add("shake");

    setTimeout(()=>{
        game.classList.remove("shake");
    },250);


    if(lives <= 0){

        endGame();

    }else{

        showMessage(
            "💥 MISS!",
            "Careful! Try again."
        );

    }

}


/* =========================================
   HIT MESSAGE
========================================= */

function showHit(){

    messageTitle.textContent =
        "🎯 HIT!";

    messageText.textContent =
        "+" + 1 + " point";

    message.classList.add("show");


    setTimeout(()=>{
        message.classList.remove("show");
    },500);


    /*
      Small target animation.
    */

    target.classList.remove("target-hit");

    void target.offsetWidth;

    target.classList.add("target-hit");


    /* Ring effect */

    const effect =
        document.createElement("div");

    effect.className =
        "hit-effect";


    const rect =
        target.getBoundingClientRect();

    const gameRect =
        game.getBoundingClientRect();


    effect.style.left =
        (rect.left-gameRect.left+
        rect.width/2-10)+"px";

    effect.style.top =
        (rect.top-gameRect.top+
        rect.height/2-10)+"px";


    game.appendChild(effect);


    setTimeout(()=>{
        effect.remove();
    },400);

}


/* =========================================
   MESSAGE
========================================= */

function showMessage(title,text){

    messageTitle.textContent =
        title;

    messageText.textContent =
        text;

    message.classList.add("show");


    setTimeout(()=>{
        message.classList.remove("show");
    },700);

}


/* =========================================
   END GAME
========================================= */

function endGame(){

    playing = false;

    target.classList.remove("rotating");

    finalScore.textContent =
        score;

    if(score > bestScore){

        bestScore = score;

        localStorage.setItem(
            "arrowHitBest",
            bestScore
        );

    }

    bestEl.textContent =
        bestScore;

    finalBest.textContent =
        bestScore;

    gameOver.classList.remove("hidden");

}


/* =========================================
   BUTTON EVENTS
========================================= */

startBtn.addEventListener(
    "click",
    startGame
);

restartBtn.addEventListener(
    "click",
    startGame
);

homeBtn.addEventListener(
    "click",
    ()=>{
        gameOver.classList.add("hidden");
        startScreen.classList.remove("hidden");

        clearArrows();

        target.classList.remove("rotating");

        playing = false;
    }
);

shootBtn.addEventListener(
    "click",
    shootArrow
);


/* =========================================
   KEYBOARD
========================================= */

document.addEventListener(
    "keydown",
    e => {

        if(
            e.code === "Space" ||
            e.code === "Enter"
        ){

            e.preventDefault();

            if(
                startScreen.classList.contains(
                    "hidden"
                ) &&
                gameOver.classList.contains(
                    "hidden"
                )
            ){

                shootArrow();

            }

        }

    }
);


/* =========================================
   TAP GAME AREA
================
