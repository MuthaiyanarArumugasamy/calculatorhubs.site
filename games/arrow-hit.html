<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>Arrow Hit - CalculatorHubs</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#08080f;
    color:white;
    font-family:Arial,sans-serif;
    min-height:100vh;
    overflow:hidden;
    touch-action:none;
}

.top{
    height:65px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    background:#10101a;
    border-bottom:1px solid #292936;
}

.logo{
    color:white;
    text-decoration:none;
    font-size:20px;
    font-weight:bold;
}

.logo span{
    color:#ffc928;
}

.back{
    color:#aaa;
    text-decoration:none;
    font-size:14px;
}

.game{
    width:100%;
    max-width:650px;
    height:calc(100vh - 65px);
    margin:auto;
    position:relative;
    overflow:hidden;
    background:
        radial-gradient(circle at center,#1c1d2b 0%,#0c0c14 55%,#050509 100%);
}

.scoreboard{
    position:absolute;
    top:18px;
    left:15px;
    right:15px;
    display:flex;
    justify-content:space-between;
    z-index:10;
}

.box{
    background:rgba(20,20,30,.9);
    border:1px solid #30303d;
    border-radius:12px;
    padding:8px 14px;
    text-align:center;
    min-width:80px;
}

.box small{
    display:block;
    color:#888;
    font-size:10px;
}

.box strong{
    font-size:20px;
}

.target{
    width:180px;
    height:180px;
    border-radius:50%;
    position:absolute;
    left:50%;
    top:42%;
    transform:translate(-50%,-50%);
    background:
        radial-gradient(
            circle,
            #ffc928 0 15%,
            #15151e 15% 27%,
            #ffc928 27% 43%,
            #15151e 43% 59%,
            #ffc928 59% 100%
        );
    border:5px solid #ffc928;
    box-shadow:0 0 30px rgba(255,201,40,.2);
    transition:transform .05s linear;
}

.target.hit{
    animation:hit .18s;
}

@keyframes hit{
    50%{transform:translate(-50%,-50%) scale(1.08);}
}

.arrow{
    position:absolute;
    width:8px;
    height:75px;
    background:linear-gradient(#ddd,#999);
    border-radius:5px;
    transform-origin:50% 100%;
    z-index:5;
}

.arrow:before{
    content:"";
    position:absolute;
    top:0;
    left:-5px;
    border-left:9px solid transparent;
    border-right:9px solid transparent;
    border-bottom:15px solid #ddd;
}

.arrow:after{
    content:"";
    position:absolute;
    bottom:-2px;
    left:-5px;
    width:18px;
    height:14px;
    background:#e33;
    clip-path:polygon(50% 0,100% 100%,50% 75%,0 100%);
}

.shoot-line{
    position:absolute;
    width:4px;
    height:75px;
    background:#eee;
    border-radius:5px;
    left:50%;
    bottom:85px;
    transform:translateX(-50%);
    z-index:4;
}

.controls{
    position:absolute;
    bottom:20px;
    left:15px;
    right:15px;
    text-align:center;
    z-index:20;
}

.shoot{
    width:100%;
    max-width:380px;
    border:0;
    border-radius:16px;
    padding:18px;
    background:#ffc928;
    color:#111;
    font-size:19px;
    font-weight:bold;
    box-shadow:0 6px 0 #b98d00;
    cursor:pointer;
}

.shoot:active{
    transform:translateY(5px);
    box-shadow:0 1px 0 #b98d00;
}

.message{
    position:absolute;
    top:55%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    width:90%;
    z-index:30;
}

.message h1{
    font-size:34px;
    margin-bottom:10px;
}

.message p{
    color:#aaa;
    margin-bottom:20px;
}

.restart{
    border:0;
    background:#ffc928;
    color:#111;
    padding:14px 30px;
    border-radius:12px;
    font-weight:bold;
    font-size:16px;
}

.hidden{
    display:none;
}

@media(max-width:500px){
    .target{
        width:155px;
        height:155px;
    }

    .game{
        height:calc(100vh - 65px);
    }
}
</style>
</head>

<body>

<header class="top">

    <a href="../index.html" class="logo">
        Calculator<span>Hubs</span>
    </a>

    <a href="index.html" class="back">
        ← Games
    </a>

</header>

<div class="game" id="game">

    <div class="scoreboard">

        <div class="box">
            <small>SCORE</small>
            <strong id="score">0</strong>
        </div>

        <div class="box">
            <small>LEVEL</small>
            <strong id="level">1</strong>
        </div>

        <div class="box">
            <small>BEST</small>
            <strong id="best">0</strong>
        </div>

    </div>

    <div id="target" class="target"></div>

    <div id="shootLine" class="shoot-line"></div>

    <div class="controls">
        <button id="shoot
