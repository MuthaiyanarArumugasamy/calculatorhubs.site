<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laptop Battery Backup Calculator | CalculatorHubs</title>

<style>
*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}
body{
margin:0;
padding:20px;
background:#f5f5f5;
}
.container{
max-width:500px;
margin:auto;
background:#fff;
padding:20px;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,.15);
}
h2{
text-align:center;
color:#0066cc;
}
label{
display:block;
margin-top:15px;
font-weight:bold;
}
input{
width:100%;
padding:10px;
margin-top:5px;
border:1px solid #ccc;
border-radius:5px;
font-size:16px;
}
button{
width:100%;
padding:12px;
margin-top:20px;
background:#0066cc;
color:#fff;
border:none;
border-radius:5px;
font-size:18px;
cursor:pointer;
}
button:hover{
background:#004c99;
}
.result{
margin-top:20px;
padding:15px;
background:#eef7ff;
border-radius:8px;
line-height:1.8;
font-size:18px;
}
</style>
</head>
<body>

<div class="container">

<h2>Laptop Battery Backup Calculator</h2>

<label>Battery Capacity (Wh)</label>
<input type="number" id="battery" placeholder="60">

<label>Average Power Consumption (Watts)</label>
<input type="number" id="power" placeholder="15">

<button onclick="calculateBattery()">Calculate</button>

<div class="result" id="result"></div>

</div>

<script>

function calculateBattery(){

let battery=parseFloat(document.getElementById("battery").value);
let power=parseFloat(document.getElementById("power").value);

if(isNaN(battery)||isNaN(power)||battery<=0||power<=0){
document.getElementById("result").innerHTML="Please enter valid values.";
return;
}

let hours=battery/power;
let h=Math.floor(hours);
let m=Math.round((hours-h)*60);

document.getElementById("result").innerHTML=
"<b>Estimated Battery Backup</b><br><br>"+
h+" Hours "+m+" Minutes";

}

</script>

</body>
</html>
