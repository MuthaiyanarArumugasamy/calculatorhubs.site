<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drone Flight Time Calculator | CalculatorHubs</title>

<style>
*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}
body{
margin:0;
padding:20px;
background:#f4f4f4;
}
.container{
max-width:500px;
margin:auto;
background:#fff;
padding:20px;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,.15);
}
h2{
text-align:center;
color:#198754;
}
label{
display:block;
margin-top:15px;
font-weight:bold;
}
input{
width:100%;
padding:10px;
margin-top:5px;
border:1px solid #ccc;
border-radius:5px;
font-size:16px;
}
button{
width:100%;
margin-top:20px;
padding:12px;
background:#198754;
color:#fff;
border:none;
border-radius:5px;
font-size:18px;
cursor:pointer;
}
.result{
margin-top:20px;
padding:15px;
background:#eefaf2;
border-radius:8px;
font-size:18px;
line-height:1.8;
}
</style>
</head>

<body>

<div class="container">

<h2>Drone Flight Time Calculator</h2>

<label>Battery Capacity (mAh)</label>
<input type="number" id="battery" placeholder="5000">

<label>Average Current Draw (mA)</label>
<input type="number" id="current" placeholder="12000">

<label>Battery Usage (%)</label>
<input type="number" id="usage" value="80">

<button onclick="calculateFlight()">Calculate</button>

<div class="result" id="result"></div>

</div>

<script>

function calculateFlight(){

let battery=parseFloat(document.getElementById("battery").value);
let current=parseFloat(document.getElementById("current").value);
let usage=parseFloat(document.getElementById("usage").value);

if(isNaN(battery)||isNaN(current)||isNaN(usage)||battery<=0||current<=0||usage<=0){
document.getElementById("result").innerHTML="Please enter valid values.";
return;
}

let hours=(battery*(usage/100))/current;
let minutes=hours*60;

document.getElementById("result").innerHTML=
"<b>Estimated Flight Time:</b> "+minutes.toFixed(1)+" Minutes";

}

</script>

</body>
</html>
