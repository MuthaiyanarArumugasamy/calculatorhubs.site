<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Startup Burn Rate Calculator | CalculatorHubs</title>

<style>
*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}
body{
margin:0;
padding:20px;
background:#f4f4f4;
}
.container{
max-width:500px;
margin:auto;
background:#fff;
padding:20px;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,.15);
}
h2{
text-align:center;
color:#6f42c1;
}
label{
display:block;
margin-top:15px;
font-weight:bold;
}
input{
width:100%;
padding:10px;
margin-top:5px;
border:1px solid #ccc;
border-radius:5px;
font-size:16px;
}
button{
width:100%;
padding:12px;
margin-top:20px;
background:#6f42c1;
color:#fff;
border:none;
border-radius:5px;
font-size:18px;
cursor:pointer;
}
.result{
margin-top:20px;
padding:15px;
background:#f3edff;
border-radius:8px;
line-height:1.8;
font-size:18px;
}
</style>
</head>

<body>

<div class="container">

<h2>Startup Burn Rate Calculator</h2>

<label>Cash Available ($)</label>
<input type="number" id="cash" placeholder="100000">

<label>Monthly Expenses ($)</label>
<input type="number" id="expenses" placeholder="10000">

<button onclick="calculateBurnRate()">Calculate</button>

<div class="result" id="result"></div>

</div>

<script>

function calculateBurnRate(){

let cash=parseFloat(document.getElementById("cash").value);
let expenses=parseFloat(document.getElementById("expenses").value);

if(isNaN(cash)||isNaN(expenses)||cash<=0||expenses<=0){
document.getElementById("result").innerHTML="Please enter valid values.";
return;
}

let runway=cash/expenses;

document.getElementById("result").innerHTML=
"<b>Monthly Burn Rate:</b> $"+expenses.toFixed(2)+"<br>"+
"<b>Estimated Runway:</b> "+runway.toFixed(1)+" Months";

}

</script>

</body>
</html>
