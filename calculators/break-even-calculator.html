<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Break-Even Point Calculator | CalculatorHubs</title>

<style>
*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}
body{
margin:0;
padding:20px;
background:#f5f5f5;
}
.container{
max-width:500px;
margin:auto;
background:#fff;
padding:20px;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,.15);
}
h2{
text-align:center;
color:#28a745;
}
label{
display:block;
margin-top:15px;
font-weight:bold;
}
input{
width:100%;
padding:10px;
margin-top:5px;
border:1px solid #ccc;
border-radius:5px;
font-size:16px;
}
button{
width:100%;
padding:12px;
margin-top:20px;
background:#28a745;
color:#fff;
border:none;
border-radius:5px;
font-size:18px;
cursor:pointer;
}
button:hover{
background:#218838;
}
.result{
margin-top:20px;
padding:15px;
background:#eef9f0;
border-radius:8px;
font-size:18px;
line-height:1.8;
}
</style>
</head>

<body>

<div class="container">

<h2>Break-Even Point Calculator</h2>

<label>Fixed Costs ($)</label>
<input type="number" id="fixed" placeholder="10000">

<label>Selling Price per Unit ($)</label>
<input type="number" id="price" placeholder="50">

<label>Variable Cost per Unit ($)</label>
<input type="number" id="variable" placeholder="30">

<button onclick="calculateBreakEven()">Calculate</button>

<div class="result" id="result"></div>

</div>

<script>

function calculateBreakEven(){

let fixed=parseFloat(document.getElementById("fixed").value);
let price=parseFloat(document.getElementById("price").value);
let variable=parseFloat(document.getElementById("variable").value);

if(isNaN(fixed)||isNaN(price)||isNaN(variable)||fixed<=0||price<=variable){
document.getElementById("result").innerHTML="Please enter valid values.";
return;
}

let units=fixed/(price-variable);
let revenue=units*price;

document.getElementById("result").innerHTML=
"<b>Break-Even Units:</b> "+Math.ceil(units)+" Units<br>"+
"<b>Break-Even Revenue:</b> $"+revenue.toFixed(2);

}

</script>

</body>
</html>
