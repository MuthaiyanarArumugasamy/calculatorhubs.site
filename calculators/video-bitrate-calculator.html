<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Bitrate Calculator | CalculatorHubs</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
padding:20px;
}

.container{
max-width:500px;
margin:auto;
background:#fff;
padding:20px;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,.15);
}

h2{
text-align:center;
color:#ff5722;
margin-bottom:20px;
}

label{
display:block;
margin-top:15px;
font-weight:bold;
}

input,select{
width:100%;
padding:10px;
margin-top:5px;
border:1px solid #ccc;
border-radius:5px;
font-size:16px;
}

button{
width:100%;
padding:12px;
margin-top:20px;
background:#ff5722;
color:white;
border:none;
border-radius:5px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#e64a19;
}

.result{
margin-top:20px;
padding:15px;
background:#fff3e0;
border-radius:8px;
line-height:1.8;
font-size:18px;
}
</style>

</head>
<body>

<div class="container">

<h2>Video Bitrate Calculator</h2>

<label>Video Size (MB)</label>
<input type="number" id="size" placeholder="500">

<label>Video Duration (Minutes)</label>
<input type="number" id="duration" placeholder="10">

<label>Audio Bitrate (kbps)</label>
<input type="number" id="audio" value="128">

<button onclick="calculate()">Calculate</button>

<div class="result" id="result"></div>

</div>

<script>

function calculate(){

let size=parseFloat(document.getElementById("size").value);
let duration=parseFloat(document.getElementById("duration").value);
let audio=parseFloat(document.getElementById("audio").value);

if(isNaN(size)||isNaN(duration)||isNaN(audio)||size<=0||duration<=0){

document.getElementById("result").innerHTML="Please enter valid values.";

return;

}

let totalKbits=size*8192;
let seconds=duration*60;
let totalBitrate=totalKbits/seconds;
let videoBitrate=totalBitrate-audio;

document.getElementById("result").innerHTML=

"<b>Total Bitrate:</b> "+totalBitrate.toFixed(2)+" kbps<br>"+

"<b>Recommended Video Bitrate:</b> "+videoBitrate.toFixed(2)+" kbps<br>"+

"<b>Audio Bitrate:</b> "+audio+" kbps";

}

</script>

</body>
</html>
