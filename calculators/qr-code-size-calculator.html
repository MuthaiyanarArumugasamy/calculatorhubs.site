<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Code Size Calculator | CalculatorHubs</title>

<style>
*{
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}
body{
    margin:0;
    padding:20px;
    background:#f4f4f4;
}
.container{
    max-width:500px;
    margin:auto;
    background:#fff;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
}
h2{
    text-align:center;
    color:#222;
}
label{
    display:block;
    margin-top:15px;
    font-weight:bold;
}
input,select{
    width:100%;
    padding:10px;
    margin-top:5px;
    border:1px solid #ccc;
    border-radius:5px;
}
button{
    width:100%;
    padding:12px;
    margin-top:20px;
    background:#000;
    color:#fff;
    border:none;
    border-radius:5px;
    font-size:17px;
    cursor:pointer;
}
.result{
    margin-top:20px;
    background:#eef5ff;
    padding:15px;
    border-radius:8px;
}
</style>
</head>

<body>

<div class="container">

<h2>QR Code Size Calculator</h2>

<label>QR Version (1 - 40)</label>
<input type="number" id="version" min="1" max="40" placeholder="5">

<label>Print DPI</label>
<select id="dpi">
<option value="150">150 DPI</option>
<option value="300" selected>300 DPI</option>
<option value="600">600 DPI</option>
</select>

<label>Module Size (mm)</label>
<input type="number" id="module" value="0.4" step="0.1">

<button onclick="calculateQR()">Calculate</button>

<div class="result" id="result"></div>

</div>

<script>

function calculateQR(){

let version=parseInt(document.getElementById("version").value);
let dpi=parseFloat(document.getElementById("dpi").value);
let module=parseFloat(document.getElementById("module").value);

if(version<1||version>40||isNaN(module)){
document.getElementById("result").innerHTML="Enter valid values.";
return;
}

let modules=(version-1)*4+21;
let sizeMM=modules*module;
let inches=sizeMM/25.4;
let pixels=Math.round(inches*dpi);

document.getElementById("result").innerHTML=
"<b>Total Modules:</b> "+modules+
"<br><b>Recommended Print Size:</b> "+sizeMM.toFixed(2)+" mm"+
"<br><b>Image Size:</b> "+pixels+" × "+pixels+" pixels";

}

</script>

</body>
</html>
