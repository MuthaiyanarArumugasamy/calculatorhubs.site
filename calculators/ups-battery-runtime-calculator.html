<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UPS Battery Runtime Calculator | CalculatorHubs</title>

<style>
*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}
body{
margin:0;
padding:20px;
background:#f4f4f4;
}
.container{
max-width:500px;
margin:auto;
background:#fff;
padding:20px;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,.15);
}
h2{
text-align:center;
color:#ff9800;
}
label{
display:block;
margin-top:15px;
font-weight:bold;
}
input{
width:100%;
padding:10px;
margin-top:5px;
border:1px solid #ccc;
border-radius:5px;
font-size:16px;
}
button{
width:100%;
padding:12px;
margin-top:20px;
background:#ff9800;
color:#fff;
border:none;
border-radius:5px;
font-size:18px;
cursor:pointer;
}
.result{
margin-top:20px;
padding:15px;
background:#fff8e1;
border-radius:8px;
line-height:1.8;
font-size:18px;
}
</style>
</head>

<body>

<div class="container">

<h2>UPS Battery Runtime Calculator</h2>

<label>Battery Voltage (V)</label>
<input type="number" id="voltage" placeholder="12">

<label>Battery Capacity (Ah)</label>
<input type="number" id="capacity" placeholder="100">

<label>Load (Watts)</label>
<input type="number" id="load" placeholder="250">

<label>UPS Efficiency (%)</label>
<input type="number" id="efficiency" value="85">

<button onclick="calculateRuntime()">Calculate Runtime</button>

<div class="result" id="result"></div>

</div>

<script>

function calculateRuntime(){

let voltage=parseFloat(document.getElementById("voltage").value);
let capacity=parseFloat(document.getElementById("capacity").value);
let load=parseFloat(document.getElementById("load").value);
let efficiency=parseFloat(document.getElementById("efficiency").value);

if(isNaN(voltage)||isNaN(capacity)||isNaN(load)||isNaN(efficiency)||
voltage<=0||capacity<=0||load<=0||efficiency<=0){
document.getElementById("result").innerHTML="Please enter valid values.";
return;
}

let runtime=((voltage*capacity)*(efficiency/100))/load;

let hours=Math.floor(runtime);
let minutes=Math.round((runtime-hours)*60);

document.getElementById("result").innerHTML=
"<b>Estimated Backup Time</b><br><br>"+
hours+" Hours "+minutes+" Minutes";

}

</script>

</body>
</html>
