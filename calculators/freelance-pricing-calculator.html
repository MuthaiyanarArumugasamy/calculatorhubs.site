<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Freelance Pricing Calculator | CalculatorHubs</title>

<style>
*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}
body{
margin:0;
padding:20px;
background:#f5f5f5;
}
.container{
max-width:500px;
margin:auto;
background:#fff;
padding:20px;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,.15);
}
h2{
text-align:center;
color:#009688;
}
label{
display:block;
margin-top:15px;
font-weight:bold;
}
input{
width:100%;
padding:10px;
margin-top:5px;
border:1px solid #ccc;
border-radius:5px;
font-size:16px;
}
button{
width:100%;
padding:12px;
margin-top:20px;
background:#009688;
color:#fff;
border:none;
border-radius:5px;
font-size:18px;
cursor:pointer;
}
.result{
margin-top:20px;
padding:15px;
background:#e8f5f3;
border-radius:8px;
font-size:18px;
line-height:1.8;
}
</style>
</head>

<body>

<div class="container">

<h2>Freelance Pricing Calculator</h2>

<label>Hourly Rate ($)</label>
<input type="number" id="rate" placeholder="25">

<label>Hours Required</label>
<input type="number" id="hours" placeholder="20">

<label>Additional Expenses ($)</label>
<input type="number" id="expenses" placeholder="100">

<button onclick="calculatePrice()">Calculate</button>

<div id="result" class="result"></div>

</div>

<script>

function calculatePrice(){

let rate=parseFloat(document.getElementById("rate").value);
let hours=parseFloat(document.getElementById("hours").value);
let expenses=parseFloat(document.getElementById("expenses").value)||0;

if(isNaN(rate)||isNaN(hours)||rate<=0||hours<=0){
document.getElementById("result").innerHTML="Please enter valid values.";
return;
}

let labor=rate*hours;
let total=labor+expenses;

document.getElementById("result").innerHTML=
"<b>Labor Cost:</b> $"+labor.toFixed(2)+
"<br><b>Additional Expenses:</b> $"+expenses.toFixed(2)+
"<br><b>Total Project Price:</b> $"+total.toFixed(2);

}

</script>

</body>
</html>
