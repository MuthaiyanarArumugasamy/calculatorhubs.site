<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Website Carbon Footprint Calculator | CalculatorHubs</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f5f5f5;
margin:0;
padding:20px;
}
.container{
max-width:500px;
margin:auto;
background:#fff;
padding:20px;
border-radius:10px;
box-shadow:0 2px 10px rgba(0,0,0,.15);
}
h2{
text-align:center;
color:#2e8b57;
}
label{
display:block;
margin-top:15px;
font-weight:bold;
}
input{
width:100%;
padding:10px;
margin-top:5px;
border:1px solid #ccc;
border-radius:5px;
font-size:16px;
}
button{
width:100%;
padding:12px;
margin-top:20px;
background:#2e8b57;
color:#fff;
border:none;
border-radius:5px;
font-size:18px;
cursor:pointer;
}
.result{
margin-top:20px;
padding:15px;
background:#eefaf1;
border-radius:8px;
line-height:1.8;
}
</style>
</head>

<body>

<div class="container">

<h2>Website Carbon Footprint Calculator</h2>

<label>Monthly Page Views</label>
<input type="number" id="views" placeholder="100000">

<label>Average Page Size (MB)</label>
<input type="number" id="size" placeholder="2.5">

<button onclick="calculateCarbon()">Calculate</button>

<div class="result" id="result"></div>

</div>

<script>

function calculateCarbon(){

let views=parseFloat(document.getElementById("views").value);
let size=parseFloat(document.getElementById("size").value);

if(isNaN(views)||isNaN(size)||views<=0||size<=0){
document.getElementById("result").innerHTML="Please enter valid values.";
return;
}

// Simple estimation
let co2=(views*size*0.8)/1000;

document.getElementById("result").innerHTML=
"<b>Estimated Monthly CO₂ Emission:</b> "+co2.toFixed(2)+" kg"+
"<br><b>Estimated Yearly CO₂ Emission:</b> "+(co2*12).toFixed(2)+" kg"+
"<br><br><small>*This is an approximate estimate based on page size and traffic.</small>";

}

</script>

</body>
</html>
