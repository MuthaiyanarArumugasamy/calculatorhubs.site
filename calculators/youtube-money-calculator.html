<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube Money Calculator | CalculatorHubs</title>

<style>
*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}
body{
background:#f4f4f4;
padding:20px;
margin:0;
}
.container{
max-width:500px;
margin:auto;
background:#fff;
padding:20px;
border-radius:10px;
box-shadow:0 2px 10px rgba(0,0,0,.15);
}
h2{
text-align:center;
color:#e62117;
}
label{
display:block;
margin-top:15px;
font-weight:bold;
}
input{
width:100%;
padding:10px;
margin-top:5px;
border:1px solid #ccc;
border-radius:5px;
font-size:16px;
}
button{
width:100%;
margin-top:20px;
padding:12px;
font-size:18px;
background:#e62117;
color:#fff;
border:none;
border-radius:5px;
cursor:pointer;
}
button:hover{
background:#c81d13;
}
.result{
margin-top:20px;
background:#f1f8ff;
padding:15px;
border-radius:8px;
line-height:1.8;
}
</style>
</head>

<body>

<div class="container">

<h2>YouTube Money Calculator</h2>

<label>Monthly Views</label>
<input type="number" id="views" placeholder="100000">

<label>Estimated CPM ($)</label>
<input type="number" id="cpm" placeholder="5">

<button onclick="calculate()">Calculate Earnings</button>

<div class="result" id="result"></div>

</div>

<script>

function calculate(){

let views=parseFloat(document.getElementById("views").value);
let cpm=parseFloat(document.getElementById("cpm").value);

if(isNaN(views)||isNaN(cpm)||views<0||cpm<0){
document.getElementById("result").innerHTML="Please enter valid values.";
return;
}

let monthly=(views/1000)*cpm;
let yearly=monthly*12;

document.getElementById("result").innerHTML=
"<b>Estimated Monthly Earnings:</b> $"+monthly.toFixed(2)+
"<br><b>Estimated Yearly Earnings:</b> $"+yearly.toFixed(2)+
"<br><br><small>*This is only an estimate. Actual YouTube earnings depend on audience, niche, RPM, country, and ad performance.</small>";

}

</script>

</body>
</html>
