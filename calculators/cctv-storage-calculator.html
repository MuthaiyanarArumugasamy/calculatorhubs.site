<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCTV Storage Calculator | CalculatorHubs</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f4f4f4;
margin:0;
padding:20px;
}
.container{
max-width:500px;
margin:auto;
background:#fff;
padding:20px;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,.15);
}
h2{
text-align:center;
color:#0d6efd;
}
label{
display:block;
margin-top:15px;
font-weight:bold;
}
input{
width:100%;
padding:10px;
margin-top:5px;
border:1px solid #ccc;
border-radius:5px;
}
button{
width:100%;
padding:12px;
margin-top:20px;
background:#0d6efd;
color:#fff;
border:none;
border-radius:5px;
font-size:17px;
cursor:pointer;
}
.result{
margin-top:20px;
background:#eef5ff;
padding:15px;
border-radius:8px;
line-height:1.8;
}
</style>
</head>

<body>

<div class="container">

<h2>CCTV Storage Calculator</h2>

<label>Number of Cameras</label>
<input type="number" id="cams" placeholder="4">

<label>Bitrate (Mbps per Camera)</label>
<input type="number" id="bitrate" placeholder="4">

<label>Recording Days</label>
<input type="number" id="days" placeholder="30">

<button onclick="calculateStorage()">Calculate</button>

<div class="result" id="result"></div>

</div>

<script>

function calculateStorage(){

let cams=parseFloat(document.getElementById("cams").value);
let bitrate=parseFloat(document.getElementById("bitrate").value);
let days=parseFloat(document.getElementById("days").value);

if(isNaN(cams)||isNaN(bitrate)||isNaN(days)||cams<=0||bitrate<=0||days<=0){
document.getElementById("result").innerHTML="Please enter valid values.";
return;
}

let totalMbps=cams*bitrate;
let totalGB=(totalMbps/8)*86400*days/1024;
let totalTB=totalGB/1024;

document.getElementById("result").innerHTML=
"<b>Estimated Storage:</b><br><br>"+
totalGB.toFixed(2)+" GB<br>"+
totalTB.toFixed(2)+" TB";

}

</script>

</body>
</html>
